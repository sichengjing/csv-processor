[project]
name = "csv-processor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
csvtool = "cli.main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["csvlib*", "cli*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]